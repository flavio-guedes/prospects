<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospecção — Painel</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 16px; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .column { background: #ffffff; border-radius: 10px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .column h2 { font-size: 16px; margin: 0 0 10px; }
  .status-quente { border-top: 4px solid #ef4444; }
  .status-morno { border-top: 4px solid #f59e0b; }
  .status-frio { border-top: 4px solid #3b82f6; }
  .status-followup { border-top: 4px solid #10b981; }
  .card { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .card-title { font-weight: 700; font-size: 14px; }
  .card-meta { font-size: 12px; color: #555; margin-top: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: #e5e7eb; color: #222; margin-top: 6px; }
  .actions { margin-top: 8px; display: flex; gap: 8px; }
  .actions button { border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; background: #111; color: #fff; }
  .linkedin { background: #0a66c2; }
  .email { background: #10b981; }
  .form { margin-top: 10px; display: grid; gap: 8px; }
  .form input, .form select, .form textarea { padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 13px; }
</style>
</head>
<body>
  <div class="container">
    <h1>Prospecção — Pipeline</h1>
    <div class="board">
      <div class="column status-quente">
        <h2>Quente</h2>
        <div class="card">
          <div class="card-title">Ana Padinha — Omnico</div>
          <div class="card-meta">Auto-reply em 10/ago. Candidatura Marketing com virada comercial.</div>
          <div class="badge">Retorno pendente</div>
          <div class="actions">
            <button class="linkedin" onclick="alert('Abrir LinkedIn')">LinkedIn</button>
            <button class="email" onclick="alert('Abrir e-mail')">E-mail</button>
          </div>
        </div>
      </div>
      <div class="column status-morno">
        <h2>Morno</h2>
        <div class="card">
          <div class="card-title">Alline — BWMV</div>
          <div class="card-meta">Endereço bounced anteriormente. Follow-up retomada.</div>
          <div class="badge">Follow-up atrasado</div>
          <div class="actions">
            <button class="email" onclick="alert('Enviar follow-up')">Follow-up</button>
          </div>
        </div>
      </div>
      <div class="column status-followup">
        <h2>Ação</h2>
        <form class="form" onsubmit="event.preventDefault(); alert('Salvar: ' + JSON.stringify({nome: this.nome.value, empresa: this.empresa.value, status: this.status.value, canal: this.canal.value, nota: this.nota.value})); this.reset();">
          <input name="nome" placeholder="Nome" required />
          <input name="empresa" placeholder="Empresa" />
          <select name="status">
            <option value="quente">Quente</option>
            <option value="morno">Morno</option>
            <option value="frio">Frio</option>
            <option value="followup">Follow-up</option>
          </select>
          <select name="canal">
            <option value="linkedin">LinkedIn</option>
            <option value="email">E-mail</option>
            <option value="whatsapp">WhatsApp</option>
          </select>
          <textarea name="nota" rows="3" placeholder="Nota"></textarea>
          <button type="submit">Adicionar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
